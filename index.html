<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gingerbread Shred: Crumble Edition</title>
    <style>
        body {
            background-color: #222;
            margin: 0;
            padding: 0;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #c2c3c7; /* Snow Color */
            image-rendering: pixelated; /* Sharp pixels */
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            font-size: 20px;
            pointer-events: none;
        }
        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.4);
            text-align: center;
            text-shadow: 2px 2px 0 #000;
        }
        h1 { margin: 0 0 20px 0; color: #ff004d; font-size: 30px;}
        p { margin: 5px; color: #fff1e8; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        .bonus-text {
            position: absolute;
            font-weight: bold;
            font-size: 24px;
            color: #30c873;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            pointer-events: none;
            animation: bonusFloat 1s ease-out forwards;
            z-index: 1000;
        }
        @keyframes bonusFloat {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px);
            }
        }
        /* Mobile Control Buttons */
        .control-btn {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            display: none;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }
        .control-btn.visible {
            display: flex;
        }
        .control-btn.pressed {
            background: rgba(0, 0, 0, 0.6);
        }
        .control-btn svg {
            width: 30px;
            height: 30px;
            opacity: 0.6;
        }
        .control-btn.pressed svg {
            opacity: 0.9;
        }
        #btn-left {
            bottom: 4px;
            left: 4px;
        }
        #btn-right {
            bottom: 4px;
            right: 4px;
        }
        #btn-up {
            bottom: calc(60px + 8px + 4px);
            right: calc(60px + 8px + 4px);
        }
        #btn-down {
            bottom: 4px;
            right: calc(60px + 8px + 4px);
        }
        #btn-pause {
            top: 4px;
            right: 4px;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">SCORE: 0</div>
    <div id="startScreen">
        <h1>GINGERBREAD SHRED</h1>
        <p>Arrows or Drag to Steer & Speed</p>
        <p>Double-Tap to Pause</p>
        <br>
        <p class="blink">TAP OR PRESS SPACE TO START</p>
    </div>

    <!-- Mobile Control Buttons -->
    <button id="btn-left" class="control-btn" data-direction="left">
        <svg viewBox="0 0 24 24" fill="white">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
    </button>
    <button id="btn-right" class="control-btn" data-direction="right">
        <svg viewBox="0 0 24 24" fill="white">
            <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
        </svg>
    </button>
    <button id="btn-up" class="control-btn" data-direction="up">
        <svg viewBox="0 0 24 24" fill="white">
            <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
        </svg>
    </button>
    <button id="btn-down" class="control-btn" data-direction="down">
        <svg viewBox="0 0 24 24" fill="white">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
        </svg>
    </button>
    <button id="btn-pause" class="control-btn">
        <svg viewBox="0 0 24 24" fill="white">
            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
        </svg>
    </button>
</div>

<script src="game.js"></script>
</body>
</html>
