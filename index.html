<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gingerbread Shred: Crumble Edition</title>
    <style>
        body {
            background-color: #222;
            margin: 0;
            padding: 0;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #c2c3c7; /* Snow Color */
            image-rendering: pixelated; /* Sharp pixels */
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            font-size: 20px;
            pointer-events: none;
        }
        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.4);
            text-align: center;
            text-shadow: 2px 2px 0 #000;
        }
        h1 { margin: 0 0 20px 0; color: #ff004d; font-size: 30px;}
        p { margin: 5px; color: #fff1e8; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        .bonus-text {
            position: absolute;
            font-weight: bold;
            font-size: 24px;
            color: #ffff00;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            pointer-events: none;
            animation: bonusFloat 1s ease-out forwards;
            z-index: 1000;
        }
        @keyframes bonusFloat {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px);
            }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">SCORE: 0</div>
    <div id="startScreen">
        <h1>GINGERBREAD SHRED</h1>
        <p>Arrows or Drag to Steer & Speed</p>
        <p>Double-Tap to Pause</p>
        <br>
        <p class="blink">TAP OR PRESS SPACE TO START</p>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
