<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gingerbread Shred: Crumble Edition</title>
    <style>
        body {
            background-color: #222;
            margin: 0;
            padding: 0;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #c2c3c7; /* Snow Color */
            image-rendering: pixelated; /* Sharp pixels */
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            font-size: 20px;
            pointer-events: none;
        }
        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.4);
            text-align: center;
            text-shadow: 2px 2px 0 #000;
        }
        h1 { margin: 0 0 20px 0; color: #ff004d; font-size: 30px;}
        p { margin: 5px; color: #fff1e8; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">SCORE: 0</div>
    <div id="startScreen">
        <h1>GINGERBREAD SHRED</h1>
        <p>Use LEFT / RIGHT Arrows to Turn</p>
        <p>Don't lose your head!</p>
        <br>
        <p class="blink">PRESS SPACE TO START</p>
    </div>
</div>

<script>
/** * GINGERBREAD SHRED: CRUMBLE EDITION
 * A Javascript port of the PICO-8 Design Doc
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiScore = document.getElementById('ui');
const startScreen = document.getElementById('startScreen');

// PICO-8 Palette approximation
const C = {
    white: "#fff1e8",
    black: "#000000",
    brown: "#ab5236", // Gingerbread
    green: "#008751", // Tree
    grey: "#5f574f",  // Rock
    red: "#ff004d",   // Buttons
    blue: "#29adff",  // Sky/Ice
    light_grey: "#c2c3c7"
};

const TERMINAL_VELOCITY = 20;
const SHOW_HITBOXES = false; // Debug flag to visualize collision boxes

// Obstacle Type Definitions
const OBSTACLE_TYPES = {
    tree: { w: 30, h: 25 },
    rock: { w: 30, h: 20 },
    ramp: { w: 60, h: 20 }
};

// Game State
let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
let score = 0;
let gameSpeed = 3;
let shakeAmt = 0;
let cameraX = 0; // Camera position in world space

// Inputs
const keys = { left: false, right: false };

// Touch input state
let touch = {
    active: false,
    startX: 0,
    startY: 0,
    currentX: 0,
    currentY: 0
};

// Entities
let player = {};
let obstacles = [];
let particles = [];
let snow = [];

// --- CANVAS SETUP ---

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Reinitialize player position if game is running
    if (gameState === 'PLAYING' && player.x) {
        player.x = canvas.width / 2;
    }
}

// Initialize canvas size
resizeCanvas();

// --- COLLISION DETECTION ---

/**
 * Check if two bounding boxes overlap.
 * @param {Object} box1 - First bounding box with {x, y, w, h}
 * @param {Object} box2 - Second bounding box with {x, y, w, h}
 * @returns {boolean} - True if boxes overlap, false otherwise
 */
function checkCollision(box1, box2) {
    return box1.x < box2.x + box2.w &&
           box1.x + box1.w > box2.x &&
           box1.y < box2.y + box2.h &&
           box1.y + box1.h > box2.y;
}

// --- INITIALIZATION ---

function init() {
    score = 0;
    gameSpeed = 3;
    shakeAmt = 0;
    cameraX = 0;

    // Reset input state
    keys.left = false;
    keys.right = false;
    keys.down = false;
    keys.up = false;

    // Reset Player
    player = {
        x: canvas.width / 2, // Screen position (stays centered)
        y: 100,
        w: 40,
        h: 15, // Hitbox is small here because we only care if feet/board hit
        worldX: 0, // Position in world space
        angle: 0, // Direction angle (-1 to 1, 0 is straight down)
        dx: 0, // Horizontal velocity in world space
        hp: 4, // 4:Full, 3:NoArm, 2:NoArms, 1:HeadOnly
        invul: 0,
        z: 0, // Jump height
        dz: 0, // Jump velocity
    };

    obstacles = [];
    particles = [];
    snow = [];

    // Init background snow
    for(let i=0; i<50; i++) {
        snow.push({
            worldX: (Math.random() - 0.5) * canvas.width * 2,
            y: Math.random() * canvas.height,
            size: Math.random() * 3 + 1,
            speed: Math.random() * 2 + 1
        });
    }

    gameState = 'PLAYING';
    startScreen.style.display = 'none';
    uiScore.innerText = "SCORE: 0";
    
    loop();
}

// --- UPDATE LOOP ---

function update(deltaTime) {
    if (gameState !== 'PLAYING') return;

    // Scale game speed and other time-dependent logic by deltaTime
    score += deltaTime * 100; // Adjust score increment
    uiScore.innerText = "SCORE: " + Math.floor(score / 10);

    if (Math.floor(score) % 500 === 0) gameSpeed += 0.5 * deltaTime;

    // Process touch input
    if (touch.active) {
        // Horizontal drag for steering (relative to touch start)
        const horizontalDrag = touch.startX - touch.currentX;
        if (horizontalDrag > 20) {
            // Dragged left = steer left
            keys.left = true;
            keys.right = false;
        } else if (horizontalDrag < -20) {
            // Dragged right = steer right
            keys.right = true;
            keys.left = false;
        } else {
            keys.left = false;
            keys.right = false;
        }

        // Vertical drag for speed control (relative to touch start)
        const verticalDrag = touch.startY - touch.currentY;
        if (verticalDrag > 20) {
            // Dragged up = slow down
            keys.up = true;
            keys.down = false;
        } else if (verticalDrag < -20) {
            // Dragged down = speed up
            keys.down = true;
            keys.up = false;
        } else {
            keys.up = false;
            keys.down = false;
        }
    }

    // Player movement
    if (keys.left) player.angle -= 0.06 * deltaTime * 60; // Scale by deltaTime
    if (keys.right) player.angle += 0.06 * deltaTime * 60;
    if (keys.down) gameSpeed = Math.min(5, gameSpeed + 0.05 * deltaTime * 60);
    if (keys.up) gameSpeed = Math.max(0, gameSpeed - 0.05 * deltaTime * 60);

    // Cap max speed
    gameSpeed = Math.min(TERMINAL_VELOCITY, gameSpeed);

    player.angle *= 0.99; // Angle decay
    player.angle = Math.max(-2, Math.min(2, player.angle)); // Clamp angle
    player.dx = player.angle * gameSpeed * 1.5;

    player.worldX += player.dx * deltaTime * 60; // Scale movement by deltaTime
    
    // Jumping
    player.z += player.dz * deltaTime * 60;
    player.dz -= 0.4 * deltaTime * 60; // Gravity
    player.y -= player.dz * deltaTime * 60; // Make the player "jump"
    if (player.z < 0) {
        player.z = 0;
        player.dz = 0;
        player.y = 100; // Reset Y position when landing
    }
    cameraX = player.worldX;

    // Invulnerability ticker
    if (player.invul > 0) player.invul--;

    // --- Screen Shake Decay ---
    if (shakeAmt > 0) shakeAmt *= 0.9;
    if (shakeAmt < 0.5) shakeAmt = 0;

    // --- Obstacle Spawner ---
    // Chance to spawn increases slightly with speed
    if (Math.random() < 0.03 + (gameSpeed/200)) {
        const rand = Math.random();
        const type = rand < 0.5 ? 'tree' : rand < 0.75 ? 'rock' : 'ramp';

        // Spawn in world coordinates around the visible area
        const worldXPos = player.worldX + (Math.random() - 0.5) * canvas.width * 1.5;

        // Create new obstacle
        const newObstacle = {
            type: type,
            worldX: worldXPos,
            y: canvas.height + 50,
            active: true
        };

        // Check if new obstacle collides with existing obstacles
        const newObstacleDef = OBSTACLE_TYPES[newObstacle.type];
        const newBox = {
            x: newObstacle.worldX,
            y: newObstacle.y,
            w: newObstacleDef.w,
            h: newObstacleDef.h
        };

        let canSpawn = true;
        for (let existing of obstacles) {
            const existingDef = OBSTACLE_TYPES[existing.type];
            const existingBox = {
                x: existing.worldX,
                y: existing.y,
                w: existingDef.w,
                h: existingDef.h
            };

            if (checkCollision(newBox, existingBox)) {
                canSpawn = false;
                break;
            }
        }

        // Only add obstacle if it doesn't overlap with existing ones
        if (canSpawn) {
            obstacles.push(newObstacle);
        }
    }

    // --- Update Obstacles ---
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let o = obstacles[i];
        o.y -= gameSpeed; // Move UP (simulating downhill)

        // Collision (in world space)
        if (o.active && player.invul === 0 && player.z === 0) {
            // Simple box collision using world coordinates
            const obstacleDef = OBSTACLE_TYPES[o.type];
            const playerBox = {x: player.worldX, y: player.y, w: player.w, h: player.h};
            const obstacleBox = {x: o.worldX, y: o.y, w: obstacleDef.w, h: obstacleDef.h};

            if (checkCollision(playerBox, obstacleBox)) {
                if (o.type === 'ramp') {
                    player.dz = gameSpeed * 1.5; // Jump boost
                } else {
                    hitPlayer();
                }
                o.active = false;
            }
        }

        // Cleanup - remove if off top of screen
        if (o.y < -50) obstacles.splice(i, 1);
    }

    // --- Update Particles (Limbs/Crumbs) ---
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.worldX += p.dx;
        p.y += p.dy;
        p.dy += 0.5; // Gravity
        p.rot += p.rSpeed;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // --- Update Background Snow ---
    snow.forEach(s => {
        s.y += s.speed * 0.3; // Fall downward slowly

        // Wrap vertically
        if (s.y > canvas.height) {
            s.y = 0;
            s.worldX = player.worldX + (Math.random() - 0.5) * canvas.width * 2;
        }
    });
}

/** Handle player getting hit by an obstacle. */
function hitPlayer() {
    if (Math.random() < 0.5) {
        crumble();
        return; // 30% chance to avoid damage (luck)
    }
    player.hp--;
    player.invul = 120; // 1 second invulnerability
    shakeAmt = 15;
    
    // Spawn limb particles
    crumble();

    if (player.hp <= 0) {
        gameOver();
    }
}

/** Throw crumb particles. */
function crumble() {
    // Generate a "chunk"
    particles.push({
        worldX: player.worldX,
        y: player.y,
        dx: (Math.random() - 0.5) * 10,
        dy: (Math.random() - 0.5) * 10 - 5,
        w: 15, h: 15,
        color: C.brown,
        rot: 0,
        rSpeed: (Math.random() - 0.5) * 0.5,
        life: 100
    });
    // Generate crumbs
    for(let i=0; i<5; i++) {
        particles.push({
            worldX: player.worldX,
            y: player.y,
            dx: (Math.random() - 0.5) * 15,
            dy: (Math.random() - 0.5) * 15,
            w: 5, h: 5,
            color: C.brown,
            rot: 0,
            rSpeed: 0,
            life: 60
        });
    }
}

/** Handle Game Over state. */
function gameOver() {
    gameState = 'GAMEOVER';
    startScreen.innerHTML = `
        <h1>CRUMBLED!</h1>
        <p>Score: ${Math.floor(score/10)}</p>
        <br>
        <p class="blink">PRESS SPACE TO RESTART</p>
    `;
    startScreen.style.display = 'flex';
}

/** 
 * --- DRAWING --- 
 * Draw all game elements for a frame.
*/
function draw() {
    // Clear screen
    ctx.fillStyle = C.light_grey;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Apply Shake
    ctx.save();
    if (shakeAmt > 0) {
        let dx = (Math.random() - 0.5) * shakeAmt;
        let dy = (Math.random() - 0.5) * shakeAmt;
        ctx.translate(dx, dy);
    }

    // Draw Snow (Background)
    ctx.fillStyle = "#fff";
    snow.forEach(s => {
        // Convert world X to screen X with parallax effect (0.5 = slower than obstacles)
        let screenX = (s.worldX - cameraX) * 0.5 + canvas.width / 2;

        // Only draw if visible
        if (screenX > -s.size && screenX < canvas.width + s.size) {
            ctx.fillRect(screenX, s.y, s.size, s.size);
        }
    });

    // Draw Obstacles
    obstacles.forEach(o => {
        // Convert world X to screen X using camera offset
        let screenX = o.worldX - cameraX + canvas.width / 2;
        const obstacleDef = OBSTACLE_TYPES[o.type];

        // Only draw if visible on screen
        if (screenX > -obstacleDef.w && screenX < canvas.width + obstacleDef.w) {
            if (o.type === 'tree') drawTree(screenX, o.y);
            else if(o.type === 'rock') drawRock(screenX, o.y);
            else if(o.type === 'ramp') drawRamp(screenX, o.y);

            // Draw hitbox
            if (SHOW_HITBOXES) {
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 2;
                ctx.strokeRect(screenX, o.y, obstacleDef.w, obstacleDef.h);
            }
        }
    });

    // Draw Particles
    particles.forEach(p => {
        // Convert world X to screen X
        let screenX = p.worldX - cameraX + canvas.width / 2;

        ctx.save();
        ctx.translate(screenX, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
    });

    // Draw Player
    if (gameState !== 'GAMEOVER') {
        // Blink if invulnerable
        if (Math.floor(player.invul / 4) % 2 === 0) {
            drawPlayer(player);

            // Draw player hitbox (in screen space)
            if (SHOW_HITBOXES) {
                const screenX = player.worldX - cameraX + canvas.width / 2;
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 2;
                ctx.strokeRect(screenX, player.y, player.w, player.h);
            }
        }
    }

    // Draw touch indicators
    if (touch.active && gameState === 'PLAYING') {
        drawTouchIndicators(touch.currentX, touch.currentY);
    }

    ctx.restore();
}

// --- TOUCH INDICATORS ---

function drawTouchIndicators(x, y) {
    const horizontalDrag = touch.startX - touch.currentX;
    const verticalDrag = touch.startY - touch.currentY;

    ctx.save();
    ctx.globalAlpha = 0.8;

    // Position indicators above the touch point
    const indicatorY = y - 80;
    let indicatorX = x;

    // Steering indicator (left/right arrows)
    if (horizontalDrag > 20) {
        // Left arrow
        drawArrow(indicatorX - 30, indicatorY, 'left');
    } else if (horizontalDrag < -20) {
        // Right arrow
        drawArrow(indicatorX + 30, indicatorY, 'right');
    }

    // Speed indicator (up/down arrows)
    if (verticalDrag > 20) {
        // Up arrow (slowing down)
        drawArrow(indicatorX, indicatorY - 40, 'up');
    } else if (verticalDrag < -20) {
        // Down arrow (speeding up)
        drawArrow(indicatorX, indicatorY + 40, 'down');
    }

    ctx.restore();
}

function drawArrow(x, y, direction) {
    ctx.fillStyle = C.white;
    ctx.strokeStyle = C.black;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'miter';

    ctx.beginPath();

    if (direction === 'left') {
        ctx.moveTo(x - 15, y);
        ctx.lineTo(x + 5, y - 10);
        ctx.lineTo(x + 5, y + 10);
    } else if (direction === 'right') {
        ctx.moveTo(x + 15, y);
        ctx.lineTo(x - 5, y - 10);
        ctx.lineTo(x - 5, y + 10);
    } else if (direction === 'up') {
        ctx.moveTo(x, y - 15);
        ctx.lineTo(x - 10, y + 5);
        ctx.lineTo(x + 10, y + 5);
    } else if (direction === 'down') {
        ctx.moveTo(x, y + 15);
        ctx.lineTo(x - 10, y - 5);
        ctx.lineTo(x + 10, y - 5);
    }

    ctx.closePath();
    ctx.fill();
    ctx.stroke();
}

// --- ART ASSETS (Procedural) ---

function drawPlayer(player) {
    const {x, y, z, hp, angle} = player;
    ctx.save();
    ctx.translate(x, y);
    // Shift all drawing to align drawing with player hitbox coords
    ctx.translate(20, -10);

    // Tilt based on direction angle
    ctx.rotate(angle * 0.3);    

    // Draw Snowboard
    ctx.fillStyle = C.red;
    ctx.beginPath();
    ctx.roundRect(-20, 15, 40, 10, 10);
    ctx.fill();
    ctx.strokeStyle = C.black;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.beginPath();
    ctx.ellipse(0, 25 + z, 20, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    if (hp > 0) {
        // HEAD (Always draw unless dead)
        // Position head lower when HP is 1 to sit on snowboard
        let headY = hp === 1 ? 3 : -15;
        let eyeY = hp === 1 ? 0 : -18;
        let mouthY = hp === 1 ? 8 : -10;

        ctx.fillStyle = C.brown;
        ctx.beginPath();
        ctx.arc(0, headY, 12, 0, Math.PI * 2); // Head
        ctx.fill();
        ctx.stroke();

        // Face
        ctx.fillStyle = "#fff"; // Eyes
        ctx.fillRect(-5, eyeY, 4, 4);
        ctx.fillRect(1, eyeY, 4, 4);
        ctx.fillStyle = C.red; // Mouth
        ctx.fillRect(-3, mouthY, 6, 2);
    }

    // TORSO & LEGS (Draw if HP > 1)
    if (hp > 1) {
        ctx.fillStyle = C.brown;
        // Body
        ctx.fillRect(-10, -5, 20, 20);
        ctx.strokeRect(-10, -5, 20, 20);
        // Buttons
        ctx.fillStyle = C.green;
        ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 8, 3, 0, Math.PI*2); ctx.fill();
    }

    // ARMS 
    // Left Arm (Draw if HP > 2)
    if (hp > 2) {
        ctx.fillStyle = C.brown;
        ctx.fillRect(-22, -5, 12, 8);
        ctx.strokeRect(-22, -5, 12, 8);
    }
    // Right Arm (Draw if HP > 3)
    if (hp > 3) {
        ctx.fillStyle = C.brown;
        ctx.fillRect(10, -5, 12, 8);
        ctx.strokeRect(10, -5, 12, 8);
    }

    ctx.restore();
}

function drawRamp(x, y) {
    ctx.fillStyle = C.blue;
    ctx.beginPath();
    ctx.moveTo(x + 10, y);
    ctx.lineTo(x + 50, y);
    ctx.lineTo(x + 60, y + 20);
    ctx.lineTo(x, y + 20);
    ctx.closePath();
    ctx.fill();
}

function drawTree(x, y) {
    ctx.fillStyle = C.green;
    ctx.beginPath();
    ctx.moveTo(x + 15, y - 20); // Top
    ctx.lineTo(x + 35, y + 20); // Bot Right
    ctx.lineTo(x - 5, y + 20); // Bot Left
    ctx.fill();
    
    // Trunk
    ctx.fillStyle = C.brown;
    ctx.fillRect(x + 10, y + 20, 10, 10);
}

function drawRock(x, y) {
    ctx.fillStyle = C.grey;
    ctx.beginPath();
    // Irregular rocky polygon - 30px wide, 20px tall, flat bottom
    ctx.moveTo(x, y + 20);        // Bottom left (flat)
    ctx.lineTo(x + 3, y + 10);    // Left side jagged
    ctx.lineTo(x + 7, y + 5);     // Upper left
    ctx.lineTo(x + 12, y + 2);    // Peak left
    ctx.lineTo(x + 18, y);        // Highest peak
    ctx.lineTo(x + 23, y + 4);    // Peak right
    ctx.lineTo(x + 27, y + 8);    // Upper right
    ctx.lineTo(x + 30, y + 14);   // Right side jagged
    ctx.lineTo(x + 30, y + 20);   // Bottom right (flat)
    ctx.closePath();
    ctx.fill();
}

// --- GAME LOOP ---

function loop() {
    if (gameState !== 'PLAYING') return;
    const now = performance.now();
    const deltaTime = (now - lastTime) / 1000; // Convert to seconds
    lastTime = now;

    update(deltaTime);
    draw();
    requestAnimationFrame(loop);
}

let lastTime = performance.now();

// --- LISTENERS ---

window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft') keys.left = true;
    if (e.code === 'ArrowRight') keys.right = true;
    if (e.code === 'ArrowDown') keys.down = true;
    if (e.code === 'ArrowUp') keys.up = true;
    if (e.code === 'Escape') {
        if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
            startScreen.innerHTML = `
                <h1>PAUSED</h1>
                <br>
                <p class="blink">PRESS SPACE TO RESUME</p>
            `;
            startScreen.style.display = 'flex';
        }
    }
    
    if (e.code === 'Space') {
        if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
            startScreen.style.display = 'none';
            loop();
        } else
        if (gameState === 'MENU' || gameState === 'GAMEOVER') {
            init();
        }
    }
});

window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft') keys.left = false;
    if (e.code === 'ArrowRight') keys.right = false;
    if (e.code === 'ArrowDown') keys.down = false;
    if (e.code === 'ArrowUp') keys.up = false;
});

window.addEventListener('resize', () => {
    resizeCanvas();
});

// Touch event handlers
window.addEventListener('touchstart', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touchX = e.touches[0].clientX - rect.left;
    const touchY = e.touches[0].clientY - rect.top;

    touch.active = true;
    touch.startX = touchX;
    touch.startY = touchY;
    touch.currentX = touchX;
    touch.currentY = touchY;

    // Handle menu interactions
    if (gameState === 'MENU' || gameState === 'GAMEOVER' || gameState === 'PAUSED') {
        init();
    }
}, { passive: false });

window.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!touch.active) return;

    const rect = canvas.getBoundingClientRect();
    touch.currentX = e.touches[0].clientX - rect.left;
    touch.currentY = e.touches[0].clientY - rect.top;
}, { passive: false });

window.addEventListener('touchend', e => {
    e.preventDefault();
    touch.active = false;

    // Reset keys when touch ends
    if (!touch.active) {
        keys.left = false;
        keys.right = false;
        keys.up = false;
        keys.down = false;
    }
}, { passive: false });

</script>
</body>
</html>
